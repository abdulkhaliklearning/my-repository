steps:
  # Step 1: Compile the Java code in the cloud (NO LOCAL JAR NEEDED)
  - name: 'maven:3.8.5-openjdk-17'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # Step 2: Build the Docker image using the JAR created in Step 1
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/my-repo/my-microservice:latest', '.']

images:
  - 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/my-repo/my-microservice:latest'
