steps:
  # Step 1: Build Spring Boot application
  - name: 'gcr.io/cloud-builders/mvn'
    args:
      - 'clean'
      - 'package'
      - '-DskipTests'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/springboot-repo/my-microservice:latest'
      - '.'

  # Step 3: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/springboot-repo/my-microservice:latest'

  # Step 4: Deploy Docker image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-microservice'
      - '--image'
      - 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/springboot-repo/my-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/keen-tokenizer-509013-c5/springboot-repo/my-microservice:latest'