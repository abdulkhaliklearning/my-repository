spring.application.name=my-microservice

server.port=8080

spring.datasource.url=jdbc:postgresql:///my_database?cloudSqlInstance=keen-tokenizer-509013-c5:us-central1:my-postgres-instance&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=appuser
spring.datasource.password=admin

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.cloudSqlRefreshStrategy=lazy
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000